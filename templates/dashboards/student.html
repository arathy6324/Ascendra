<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Dashboard | CareerOS</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark px-4">
        <a class="navbar-brand" href="#">SMEC CareerOS</a>
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button class="btn btn-outline-light btn-sm" type="submit">
                Logout
            </button>
        </form>
    </nav>

    <main class="container py-5">
        <h1>Welcome, {{ user.first_name|default:user.username }}</h1>
        <p class="text-secondary">Your career journey starts here.</p>

        <div class="row g-3 mt-3">
            <div class="col-md-4">
                <div class="card p-3 h-100">
                    <h5>My Learning</h5>
                    <p>Track your course and module progress.</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3 h-100">
                    <h5>My Skills</h5>
                    <p>View your assessments and skill evidence.</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3 h-100">
                    <h5>Career Opportunities</h5>
                    <p>Explore eligible jobs and placement updates.</p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
